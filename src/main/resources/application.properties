spring.application.name=OlhoNoBoleto

# Configurações de banco de dados
spring.datasource.url=${DATABASE_URL}?useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=10000&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.main.lazy-initialization=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jmx.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.idle-timeout=10000

logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

server.port=10000