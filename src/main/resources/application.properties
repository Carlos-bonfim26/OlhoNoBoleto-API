spring.application.name=OlhoNoBoleto

# URL do banco de dados
spring.datasource.url=${DATABASE_URL}?useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=30000&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ⚡ OTMIIZAÇÕES CRÍTICAS PARA STARTUP RÁPIDO
spring.main.lazy-initialization=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Configurações do JPA (otimizadas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false  # Mudei para false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 🚫 DESATIVAR RECURSOS PESADOS
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jmx.enabled=false

# ✅ HEALTH CHECK MÍNIMO
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true

# Configurações de pool de conexões
spring.datasource.hikari.connection-timeout=30000  # Reduzi para 30s
spring.datasource.hikari.maximum-pool-size=3       # Reduzi para 3
spring.datasource.hikari.idle-timeout=30000

# 📉 LOGS MÍNIMOS
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.tomcat=WARN

server.port=${PORT:9090}