spring.application.name=OlhoNoBoleto

spring.datasource.url=${DATABASE_URL}?useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=30000&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.main.lazy-initialization=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=true

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jmx.enabled=false

logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN

server.port=10000

securerandom.strongAlgorithms=NativePRNGNonBlocking