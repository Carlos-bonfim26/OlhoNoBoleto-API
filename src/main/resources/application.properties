spring.application.name=OlhoNoBoleto

# Database
spring.datasource.url=${DATABASE_URL}?useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=10000&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Otimizações críticas
spring.main.lazy-initialization=true
spring.main.web-application-type=servlet
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.validate_persistence=false

# Desativar SpringDoc
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Desativar segurança se não for usada
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Health check
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Configurações mínimas
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=10000

server.port=10000