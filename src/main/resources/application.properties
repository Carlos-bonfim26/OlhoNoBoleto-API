spring.application.name=OlhoNoBoleto

# Configuração do Banco
spring.datasource.url=${DATABASE_URL}?useSSL=true&requireSSL=false&verifyServerCertificate=false&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# HikariCP
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# Server
server.port=${PORT:10000}

# 🔴 REDUZIR LOGS - Manter apenas níveis necessários
logging.level.com.example.OlhoNoBoleto=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.transaction=WARN

# Não mostrar stack traces no response (segurança)
server.error.include-stacktrace=never
server.error.include-message=never